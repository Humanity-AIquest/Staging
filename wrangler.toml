name = "humanity-ai-quest"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# LOCAL DEV ONLY — gitignored. Production binds DB via the Cloudflare Pages
# dashboard, not this file. This exists so `wrangler pages dev` can serve the
# Functions against a LOCAL D1 while testing the redesign.
[[d1_databases]]
binding = "humanity_ai_db_staging"
database_name = "humanity_ai_local"
database_id = "local-dev-placeholder"
